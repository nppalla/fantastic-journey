<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Drop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <a class="back" href="../index.html">&larr; Arcade</a>
      <h1>Block Drop</h1>
    </header>

    <div class="layout">
      <div class="board-wrap">
        <canvas id="board" role="img" aria-label="Block Drop game board" aria-describedby="game-controls" tabindex="0"></canvas>
        <div id="overlay" class="overlay" role="dialog" aria-labelledby="overlay-title" aria-describedby="overlay-text">
          <h2 id="overlay-title">Block Drop</h2>
          <p id="overlay-text">Clear lines. Survive. Climb the levels.</p>
          <button id="start-btn" class="btn primary icon" aria-label="Start game">&#9654;</button>
        </div>
      </div>

      <aside class="panel">
        <section class="card">
          <h3>Next</h3>
          <canvas id="next" width="120" height="120" role="img" aria-label="Next piece preview"></canvas>
        </section>

        <section class="card stats" role="status" aria-live="polite" aria-atomic="true">
          <div><span class="label">Score</span><span id="score" class="value">0</span></div>
          <div><span class="label">Lines</span><span id="lines" class="value">0</span></div>
          <div><span class="label">Level</span><span id="level" class="value">1</span></div>
        </section>

        <section class="card controls">
          <button id="pause-btn" class="btn icon" aria-label="Pause game" disabled>&#10074;&#10074;</button>
          <button id="restart-btn" class="btn icon" aria-label="Restart game">&#10227;</button>
        </section>

        <section class="card help">
          <h3>Controls</h3>
          <ul id="game-controls">
            <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> Move</li>
            <li><kbd>&uarr;</kbd> Rotate</li>
            <li><kbd>&darr;</kbd> Soft drop</li>
            <li><kbd>Space</kbd> Hard drop</li>
            <li><kbd>P</kbd> Pause</li>
          </ul>
        </section>
      </aside>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
