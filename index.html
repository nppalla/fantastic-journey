<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantastic Journey Arcade</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 32px 16px;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e6ebff;
      background: radial-gradient(circle at 30% 20%, #2a1f5c, #0b1020 60%);
    }
    h1 { margin: 0; font-size: 2.6rem; letter-spacing: 0.04em; }
    .cards { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
    .card {
      width: 260px;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid #2c3a63;
      background: #131a2e;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-4px); border-color: #7c5cff; }
    .card h2 { margin: 12px 0 6px; }
    .card p { margin: 0; color: #8a96b8; line-height: 1.5; }
    .icon { font-size: 2.4rem; }
  </style>
</head>
<body>
  <h1>Fantastic Journey Arcade</h1>
  <div class="cards">
    <a class="card" href="block-drop/index.html">
      <div class="icon" aria-hidden="true">&#129521;</div>
      <h2>Block Drop</h2>
      <p>Stack falling pieces. Clear lines. Survive as the speed climbs.</p>
    </a>
    <a class="card" href="merge-2048/index.html">
      <div class="icon" aria-hidden="true">&#128290;</div>
      <h2>Merge 2048</h2>
      <p>Slide and merge number tiles until you reach 2048.</p>
    </a>
  </div>
</body>
</html>
